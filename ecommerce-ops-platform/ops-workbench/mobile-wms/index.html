<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Gryps电商运营系统</title>
<style>
*{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}body{margin:0;background:#f5f7f8;color:#172126;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang SC","Microsoft YaHei",sans-serif}body.loginLocked{position:fixed;inset:0;overflow:hidden;touch-action:none}.app{width:100%;max-width:680px;margin:auto;min-height:100vh;overflow-x:hidden}.login{position:fixed;inset:0;width:min(680px,100%);height:100vh;height:100dvh;margin:auto;padding:42px 18px;display:flex;flex-direction:column;justify-content:center;gap:22px;background:#f5f7f8;z-index:10;overflow:hidden;touch-action:none}.brand{display:flex;gap:12px;align-items:center}.logo{width:50px;height:50px;border-radius:8px;background:#0f766e;color:white;display:grid;place-items:center;font-weight:800}h1,h2,h3,p{margin:0}h1{font-size:25px}.sub{font-size:13px;color:#65737c;margin-top:5px}.card{background:white;border:1px solid #dde4e8;border-radius:8px;padding:12px;box-shadow:0 8px 24px rgba(15,35,40,.06)}form{display:grid;gap:12px}label{display:grid;gap:6px;font-size:13px;color:#65737c}input,select,textarea{width:100%;min-height:44px;border:1px solid #dde4e8;border-radius:8px;padding:10px 12px;font:inherit;font-size:16px;line-height:1.25;-webkit-appearance:none;appearance:none}textarea{min-height:76px}.btn{min-height:40px;border:0;border-radius:8px;padding:0 13px;background:#e8eef2;color:#172126;font-weight:650}.primary{background:#0f766e;color:white}.ghost{background:white;border:1px solid #dde4e8}.danger{background:#fee2e2;color:#dc2626}.main{display:none;padding-bottom:72px}.main.portalMode{padding-bottom:16px}.top{position:sticky;top:0;z-index:3;background:rgba(245,247,248,.96);border-bottom:1px solid #dde4e8;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.topActions{position:relative;display:flex;gap:8px;align-items:center}.accountMenu{position:relative}.accountPanel{display:none;position:absolute;right:0;top:calc(100% + 8px);width:180px;background:white;border:1px solid #dde4e8;border-radius:8px;box-shadow:0 12px 30px rgba(15,35,40,.14);padding:8px;z-index:6}.accountPanel.on{display:grid;gap:6px}.accountPanel .meta{padding:4px 6px 8px}.accountPanel .btn{width:100%;text-align:left}.content{padding:14px;display:grid;gap:14px}.moduleGrid{display:grid;gap:10px}.moduleCard{width:100%;text-align:left;background:white;border:1px solid #dde4e8;border-radius:8px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(15,35,40,.06)}.moduleCard b{display:block;font-size:17px;margin-bottom:4px}.moduleIcon{width:42px;height:42px;border-radius:8px;background:#e7f5f3;color:#0f766e;display:grid;place-items:center;font-weight:800;flex:0 0 auto}.moduleArrow{color:#65737c;font-size:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:white;border:1px solid #dde4e8;border-radius:8px;padding:12px}.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:#65737c}.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.quick button{height:70px;background:white;border:1px solid #dde4e8;border-radius:8px;font-weight:650;min-width:0;white-space:normal;line-height:1.2;padding:6px 4px}.page{display:none}.page.on{display:grid;gap:14px}.list{display:grid;gap:10px}.item{background:white;border:1px solid #dde4e8;border-radius:8px;padding:12px;display:grid;gap:9px}.item.off{opacity:.62}.voided{background:#f3f4f6;color:#6b7280}.reverse{background:#e0f2fe;color:#0369a1}.row{display:flex;justify-content:space-between;gap:12px}.name{font-weight:750}.meta{font-size:12px;color:#65737c;line-height:1.5}.pill{border-radius:999px;padding:4px 8px;font-size:12px;background:#eef2f7;white-space:nowrap}.low{background:#fff7ed;color:#d97706}.zero{background:#fee2e2;color:#dc2626}.ok{background:#dcfce7;color:#16a34a}.ops{display:flex;gap:8px;flex-wrap:wrap}.ops .btn{min-height:34px;font-size:13px}.search{display:flex;gap:8px}.search input{flex:1}.pickBox{display:grid;gap:8px}.pickList{display:grid;gap:8px;max-height:300px;overflow:auto}.pickItem{width:100%;text-align:left;background:white;border:1px solid #dde4e8;border-radius:8px;padding:10px;display:flex;justify-content:space-between;gap:10px}.pickItem.on{border-color:#0f766e;background:#e7f5f3}.picked{border:1px solid #99f6e4;background:#f0fdfa;border-radius:8px;padding:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(680px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:white;border-top:1px solid #dde4e8;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}.nav button{height:54px;border:0;background:transparent;border-radius:8px;color:#65737c;display:grid;place-items:center;font-size:11px;min-width:0}.nav button.on{background:#e7f5f3;color:#0f766e}.modal{display:none;position:fixed;inset:0;z-index:20;background:rgba(15,23,42,.38);align-items:end}.modal.on{display:flex}.sheet{width:min(680px,100%);margin:0 auto;background:white;border-radius:12px 12px 0 0;max-height:88vh;overflow:auto}.sheetHead{border-bottom:1px solid #dde4e8;padding:14px;display:flex;justify-content:space-between}.sheetBody{padding:14px}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#111827;color:white;padding:10px 14px;border-radius:8px;opacity:0;transition:.2s;z-index:30}.toast.on{opacity:1}.empty{text-align:center;color:#65737c;padding:28px 10px}@media(max-width:390px){.stats,.grid2{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<section id="login" class="login"><div class="brand"><div class="logo">OPS</div><div><h1>Gryps电商运营系统</h1><p class="sub">统一登录、按岗位进入业务模块</p></div></div><form id="loginForm" class="card"><label>账号<input id="u" autocomplete="username" placeholder="请输入账号"></label><label>密码<input id="p" type="password" autocomplete="current-password" placeholder="请输入密码"></label><button class="btn primary">登录系统</button></form></section>
<section id="main" class="main"><header class="top"><div><h2 id="title">Gryps电商运营系统</h2><p id="sub" class="sub">选择业务模块</p></div><div class="topActions"><button id="backBtn" class="btn ghost" onclick="backPortal()">入口</button> <button id="scanBtn" class="btn ghost" onclick="scan()">扫码</button><div class="accountMenu"><button id="accountBtn" class="btn ghost" onclick="toggleAccount(event)">账号 ▾</button><div id="accountPanel" class="accountPanel"><div id="accountMeta" class="meta"></div><button class="btn ghost" onclick="userPanel();closeAccount()">用户管理</button><button class="btn danger" onclick="logout()">退出登录</button></div></div></div></header><main class="content"><section id="portal" class="page on"></section><section id="home" class="page"></section><section id="goods" class="page"></section><section id="in" class="page"></section><section id="out" class="page"></section><section id="logPage" class="page"></section></main><nav id="nav" class="nav"><button data-p="home" class="on">⌂<span>工作台</span></button><button data-p="goods">▦<span>商品</span></button><button data-p="in">＋<span>入库</span></button><button data-p="out">－<span>出库</span></button><button data-p="logPage">≡<span>流水</span></button></nav></section>
</div><div id="modal" class="modal"><div class="sheet"><div class="sheetHead"><h3 id="mt">操作</h3><button class="btn ghost" onclick="closeM()">关闭</button></div><div id="mb" class="sheetBody"></div></div></div><div id="toast" class="toast"></div>
<script>
const API="/api",TOKEN="wms-token";let token=localStorage.getItem(TOKEN)||"",S={login:!!token,goods:[],logs:[],user:null,users:[]},P="portal",Q="",Sel={in:"",out:"",take:""},PQ={in:"",out:"",take:""};
function e(x){return String(x??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}
function msg(x){toast.textContent=x;toast.classList.add("on");setTimeout(()=>toast.classList.remove("on"),1800)}
async function api(path,opt={}){let r=await fetch(API+path,{...opt,headers:{"Content-Type":"application/json",...(token?{"Authorization":"Bearer "+token}:{}),...(opt.headers||{})}});let j=await r.json().catch(()=>({ok:false,error:"接口返回异常"}));if(!r.ok||j.ok===false)throw new Error(j.error||"请求失败");return j}
async function load(){if(!S.login)return;try{let m=await api("/me");S.user=m.user;if(S.user.must_change_password){render();forcePasswordChange();return}let [a,b]=await Promise.all([api("/products"),api("/logs")]);S.goods=a.products;S.logs=b.logs;render()}catch(err){msg(err.message);logout(false)}}
function st(g){return g.active===0?["voided","停用"]:g.stock<=0?["zero","缺货"]:g.stock<=g.min?["low","低库存"]:["ok","正常"]}
function canEdit(){return S.user&&S.user.role!=="viewer"}
function activeGoods(){return S.goods.filter(g=>g.active!==0)}
function show(p){P=p;render();scrollTo(0,0)}
function backPortal(){P="portal";render();scrollTo(0,0)}
function enterWarehouse(){P="home";render();scrollTo(0,0)}
function toggleAccount(ev){ev.stopPropagation();accountPanel.classList.toggle("on")}
function closeAccount(){accountPanel.classList.remove("on")}
function render(){document.body.classList.toggle("loginLocked",!S.login);login.style.display=S.login?"none":"flex";main.style.display=S.login?"block":"none";if(!S.login)return;let inPortal=P==="portal",map={portal:["Gryps电商运营系统","选择业务模块"],home:["仓储工作台","今日仓库状态"],goods:["商品库存","SKU、库位与安全库存"],in:["入库","到货、退货、领用入库"],out:["出库","销售、领用出库"],logPage:["库存流水","最近 200 条操作记录"]};title.textContent=map[P][0];sub.textContent=map[P][1];accountBtn.textContent=(S.user&&S.user.username?S.user.username:"账号")+" ▾";accountMeta.innerHTML=`${e(S.user&&S.user.username||"")}<br>${roleName(S.user&&S.user.role)}`;main.classList.toggle("portalMode",inPortal);nav.style.display=inPortal?"none":"grid";backBtn.style.display=inPortal?"none":"inline-block";scanBtn.style.display=inPortal?"none":"inline-block";document.querySelectorAll(".page").forEach(x=>x.classList.toggle("on",x.id==P));document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x.dataset.p==P));portalPage();homePage();goodsPage();movePage("in");movePage("out");logsPage()}
function portalPage(){let goods=activeGoods(),low=goods.filter(g=>g.stock<=g.min).length,role=roleName(S.user&&S.user.role),warehouseText=canEdit()?"商品、入库、出库、盘点、库存流水":"商品库存和库存流水只读查看";let admin=S.user&&S.user.role==="admin"?`<button class="moduleCard" onclick="userPanel()"><span class="moduleIcon">USR</span><span><b>用户与权限</b><span class="meta">维护移动端账号和岗位角色</span></span><span class="moduleArrow">›</span></button>`:"";portal.innerHTML=`<div class="card"><div class="name">${e(S.user&&S.user.username||"")}</div><div class="meta">当前身份：${e(role)}</div></div><div class="stats"><div class="stat"><b>${goods.length}</b><span>启用 SKU</span></div><div class="stat"><b>${low}</b><span>预警 SKU</span></div><div class="stat"><b>${S.logs.length}</b><span>最近流水</span></div></div><div class="moduleGrid"><button class="moduleCard" onclick="enterWarehouse()"><span class="moduleIcon">WMS</span><span><b>仓储管理</b><span class="meta">${warehouseText}</span></span><span class="moduleArrow">›</span></button>${admin}</div>`}
function card(g){let a=st(g),on=g.active!==0,ops=canEdit()?`${on?`<button class="btn" onclick="pick(&quot;in&quot;,&quot;${g.id}&quot;)">入库</button><button class="btn" onclick="pick(&quot;out&quot;,&quot;${g.id}&quot;)">出库</button>`:""}<button class="btn" onclick="formGood(&quot;${g.id}&quot;)">编辑</button><button class="btn ${on?"danger":""}" onclick="setActive(&quot;${g.id}&quot;,${on?0:1})">${on?"停用":"启用"}</button>`:"";return `<div class="item ${on?"":"off"}"><div class="row"><div><div class="name">${e(g.name)}</div><div class="meta">${e(g.sku)} · ${e(g.code)}<br>库位 ${e(g.loc)}</div></div><span class="pill ${a[0]}">${a[1]}</span></div><div><b>${g.stock}</b><span class="meta"> ${e(g.unit)} / 安全 ${g.min}</span></div><div class="ops">${ops}</div></div>`}
function homePage(){let goods=activeGoods(),total=goods.reduce((a,g)=>a+g.stock,0),low=goods.filter(g=>g.stock<=g.min);home.innerHTML=`<div class="stats"><div class="stat"><b>${goods.length}</b><span>启用 SKU</span></div><div class="stat"><b>${total}</b><span>库存总数</span></div><div class="stat"><b>${low.length}</b><span>预警 SKU</span></div></div><h3>库存预警</h3><div class="list">${low.map(card).join("")||"<div class=\"card empty\">暂无库存预警</div>"}</div>`}
function goodsListHtml(){let list=S.goods.filter(g=>(g.name+g.sku+g.code+g.loc).toLowerCase().includes(Q.toLowerCase()));return list.map(card).join("")||"<div class=\"card empty\">没有匹配商品</div>"}
function goodsPage(){goods.innerHTML=`<div class="search"><input id="goodsSearch" placeholder="搜索商品、SKU、条码、库位" value="${e(Q)}" oninput="Q=this.value;drawGoodsList()"><button class="btn primary" onclick="formGood()">新增</button></div><div id="goodsList" class="list">${goodsListHtml()}</div>`}
function drawGoodsList(){let el=document.getElementById("goodsList");if(el)el.innerHTML=goodsListHtml()}
function matchGoods(ctx){let q=(PQ[ctx]||"").trim().toLowerCase();if(!q)return [];return activeGoods().filter(g=>(g.name+g.sku+g.code+g.loc).toLowerCase().includes(q)).slice(0,30)}
function pickerResultsHtml(ctx){let q=(PQ[ctx]||"").trim(),list=matchGoods(ctx);if(!q)return '<div class="card empty">输入关键词后显示匹配商品</div>';return list.map(g=>`<button type="button" class="pickItem ${String(g.id)===String(Sel[ctx])?"on":""}" onclick="selectProduct(&quot;${ctx}&quot;,&quot;${g.id}&quot;)"><span><b>${e(g.name)}</b><br><span class="meta">${e(g.sku)} · ${e(g.code)} · ${e(g.loc)}</span></span><span class="pill">${g.stock}${e(g.unit)}</span></button>`).join("")||"<div class=\"card empty\">没有匹配商品</div>"}
function pickedHtml(ctx){let sel=S.goods.find(g=>String(g.id)===String(Sel[ctx]));return sel?`<div class="picked"><div class="name">已选：${e(sel.name)}</div><div class="meta">${e(sel.sku)} · ${e(sel.code)} · 库位 ${e(sel.loc)} · 当前 ${sel.stock}${e(sel.unit)}</div></div>`:""}
function pickerHtml(ctx){return `<div class="pickBox"><input name="id" type="hidden" value="${e(Sel[ctx]||"")}"><label>商品搜索<input placeholder="输入商品名、SKU、条码、库位" value="${e(PQ[ctx]||"")}" oninput="searchProduct(&quot;${ctx}&quot;,this.value)"></label><div id="picked-${ctx}">${pickedHtml(ctx)}</div><div id="pickList-${ctx}" class="pickList">${pickerResultsHtml(ctx)}</div></div>`}
function searchProduct(ctx,val){PQ[ctx]=val;let el=document.getElementById(`pickList-${ctx}`);if(el)el.innerHTML=pickerResultsHtml(ctx)}
function drawPicker(ctx){let el=document.getElementById(`picker-${ctx}`);if(el)el.innerHTML=pickerHtml(ctx)}
function selectProduct(ctx,id){Sel[ctx]=id;PQ[ctx]="";let root=document.getElementById(`picker-${ctx}`);if(!root)return;let hidden=root.querySelector('input[name=id]');if(hidden)hidden.value=id;let inp=root.querySelector('label input');if(inp)inp.value="";let picked=document.getElementById(`picked-${ctx}`);if(picked)picked.innerHTML=pickedHtml(ctx);let list=document.getElementById(`pickList-${ctx}`);if(list)list.innerHTML=pickerResultsHtml(ctx)}
function movePage(t){let inbound=t=="in",biz=inbound?["到货入库","退货入库","领用入库"]:["销售出库","领用出库"];document.getElementById(t).innerHTML=`<form class="card" onsubmit="move(event,&quot;${t}&quot;)"><div id="picker-${t}">${pickerHtml(t)}</div><div class="grid2"><label>数量<input name="n" type="number" min="1" required></label><label>业务类型<select name="biz">${biz.map(x=>`<option>${x}</option>`).join("")}</select></label></div><label>备注<textarea name="remark" placeholder="供应商、订单号、领用人、退货原因等"></textarea></label><button class="btn primary">确认${inbound?"入库":"出库"}</button></form>`}

async function move(ev,t){ev.preventDefault();let f=new FormData(ev.target);if(!f.get("id"))return msg("请先选择商品");try{await api("/movements",{method:"POST",body:JSON.stringify({id:f.get("id"),type:t,business:f.get("biz"),qty:Number(f.get("n")),remark:f.get("remark")})});ev.target.reset();Sel[t]="";PQ[t]="";msg("操作成功");await load()}catch(err){msg(err.message)}}
function logSign(l){let d=Number(l.stock)-Number(l.before);return d>0?"+":d<0?"-":""}
function logsPage(){logPage.innerHTML=`<div class="row"><h3>库存流水</h3><button class="btn ghost" onclick="exportLogs()">导出</button></div><div class="list">${S.logs.map(l=>{let rev=!!l.reverse_of,voided=!!l.voided,actions=canEdit()&&!voided&&!rev&&l.kind!=="void"?`<button class="btn danger" onclick="voidLog(&quot;${l.id}&quot;)">作废</button>`:"";return `<div class="item ${voided?"off":""}"><div class="row"><div><div class="name">${e(l.t)} · ${e(l.name)} ${voided?"<span class=\"pill voided\">已作废</span>":rev?"<span class=\"pill reverse\">冲销单</span>":""}</div><div class="meta">单号 ${e(l.doc_no||"-")}<br>${e(l.time)} · ${e(l.sku)} · ${e(l.operator)}<br>${e(l.remark)}${voided?`<br>作废：${e(l.voided_by)} · ${e(l.voided_at)} · ${e(l.void_reason)}`:""}</div></div><span class="pill">${logSign(l)}${l.n}</span></div><div class="row"><div class="meta">变更前：${l.before} · 操作后库存：${l.stock}</div><div class="ops">${actions}</div></div></div>`}).join("")||"<div class=\"card empty\">暂无流水</div>"}</div>`}
function openM(t,h){mt.textContent=t;mb.innerHTML=h;modal.classList.add("on")}function closeM(){modal.classList.remove("on")}
function formGood(id=""){let g=S.goods.find(x=>String(x.id)==String(id))||{sku:"",code:"",name:"",loc:"",stock:0,min:0,unit:"件"};openM(id?"编辑商品":"新增商品",`<form onsubmit="saveGood(event,&quot;${id}&quot;)"><label>商品名称<input name="name" required value="${e(g.name)}"></label><div class="grid2"><label>SKU<input name="sku" required value="${e(g.sku)}"></label><label>条码<input name="code" value="${e(g.code)}"></label></div><div class="grid2"><label>库位<input name="loc" value="${e(g.loc)}"></label><label>单位<input name="unit" required value="${e(g.unit)}"></label></div><div class="grid2"><label>库存<input name="stock" type="number" min="0" value="${g.stock}"></label><label>安全库存<input name="min" type="number" min="0" value="${g.min}"></label></div><button class="btn primary">保存</button></form>`)}
async function saveGood(ev,id){ev.preventDefault();let f=new FormData(ev.target),d={sku:f.get("sku"),code:f.get("code"),name:f.get("name"),loc:f.get("loc"),stock:Number(f.get("stock")),min:Number(f.get("min")),unit:f.get("unit")};try{await api(id?"/products/"+id:"/products",{method:id?"PUT":"POST",body:JSON.stringify(d)});closeM();msg("已保存");await load()}catch(err){msg(err.message)}}
async function setActive(id,active){try{await api(`/products/${id}/active`,{method:"POST",body:JSON.stringify({active})});msg(active?"已启用":"已停用");await load()}catch(err){msg(err.message)}}
function voidLog(id){openM("作废流水",`<form onsubmit="voidSubmit(event,&quot;${id}&quot;)"><label>作废原因<textarea name="reason" required placeholder="例如录错数量、选错商品、重复入库等"></textarea></label><button class="btn danger">确认作废并冲销库存</button></form>`)}
async function voidSubmit(ev,id){ev.preventDefault();let f=new FormData(ev.target);try{await api(`/logs/${id}/void`,{method:"POST",body:JSON.stringify({reason:f.get("reason")})});closeM();msg("已作废并生成冲销流水");await load()}catch(err){msg(err.message)}}
function pick(t,id){Sel[t]=id;show(t);setTimeout(()=>drawPicker(t))}function pickBiz(t,biz){show(t);setTimeout(()=>{let x=document.querySelector(`#${t} select[name=biz]`);if(x)x.value=biz})}
function stocktake(){Sel.take="";PQ.take="";openM("移动盘点",`<form onsubmit="take(event)"><div id="picker-take">${pickerHtml("take")}</div><label>实盘数量<input name="n" type="number" min="0" required></label><label>备注<textarea name="remark"></textarea></label><button class="btn primary">确认盘点</button></form>`)}
async function take(ev){ev.preventDefault();let f=new FormData(ev.target);if(!f.get("id"))return msg("请先选择商品");try{await api("/movements",{method:"POST",body:JSON.stringify({id:f.get("id"),type:"stocktake",business:"盘点",qty:Number(f.get("n")),remark:f.get("remark")})});closeM();Sel.take="";PQ.take="";msg("盘点已更新");await load()}catch(err){msg(err.message)}}
async function userPanel(){
  let html=`<div class="card" style="margin-bottom:12px"><div class="name">当前用户：${e(S.user&&S.user.username||"")}</div><div class="meta">角色：${roleName(S.user&&S.user.role)}${S.user&&S.user.must_change_password?" · 需要修改默认密码":""}</div></div><form onsubmit="changePwd(event)" class="card"><h3>修改密码</h3><label>原密码<input name="old" type="password" required></label><label>新密码<input name="pwd" type="password" minlength="8" required></label><button class="btn primary">保存新密码</button></form>`;
  if(S.user&&S.user.role==="admin"){
    try{S.users=(await api("/users")).users}catch(err){msg(err.message)}
    html+=`<div class="card" style="margin-top:12px"><h3>用户列表</h3><div class="list" style="margin-top:10px">${S.users.map(u=>`<div class="row"><div><div class="name">${e(u.username)}</div><div class="meta">${roleName(u.role)} · ${e(u.created_at)}</div></div></div>`).join("")}</div></div><form onsubmit="createUser(event)" class="card" style="margin-top:12px"><h3>新增用户</h3><label>账号<input name="username" minlength="3" required></label><label>密码<input name="password" type="password" minlength="8" required></label><label>角色<select name="role"><option value="keeper">仓管员</option><option value="viewer">只读查看</option><option value="admin">管理员</option></select></label><button class="btn primary">新增用户</button></form>`;
  }
  openM("用户管理",html)
}
function roleName(r){return {admin:"管理员",keeper:"仓管员",viewer:"只读查看"}[r]||r||""}
async function changePwd(ev){ev.preventDefault();let f=new FormData(ev.target);try{await api("/change-password",{method:"POST",body:JSON.stringify({old_password:f.get("old"),new_password:f.get("pwd")})});msg("密码已修改，请重新登录");closeM();logout()}catch(err){msg(err.message)}}
async function createUser(ev){ev.preventDefault();let f=new FormData(ev.target);try{await api("/users",{method:"POST",body:JSON.stringify({username:f.get("username"),password:f.get("password"),role:f.get("role")})});msg("用户已新增");await userPanel()}catch(err){msg(err.message)}}
function scan(){openM("扫码录入",`<label>条码或 SKU<input id="codeInput"></label><button class="btn primary" onclick="findCode()">查询商品</button><p class="sub">绑定 HTTPS 域名后可启用摄像头扫码。</p>`)}
function findCode(){let c=codeInput.value.trim(),g=S.goods.find(x=>x.code==c||x.sku==c);if(!g)return msg("未找到商品");closeM();Q=c;show("goods")}
async function exportLogs(){try{let r=await fetch(API+"/export/logs.csv",{headers:token?{"Authorization":"Bearer "+token}:{}});if(!r.ok){let j=await r.json().catch(()=>({error:"导出失败"}));throw new Error(j.error||"导出失败")}let blob=await r.blob();let url=URL.createObjectURL(blob);let a=document.createElement("a");a.href=url;a.download="wms-logs.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(err){msg(err.message)}}
function logout(clear=true){if(clear&&token)api("/logout",{method:"POST",body:"{}"}).catch(()=>{});if(clear){token="";localStorage.removeItem(TOKEN)}S.login=false;S.user=null;P="portal";render()}
function forcePasswordChange(){openM("修改默认密码",`<form onsubmit="changePwd(event)" class="card"><p class="sub" style="margin-bottom:10px">首次公网使用前必须修改默认密码。</p><label>原密码<input name="old" type="password" required></label><label>新密码<input name="pwd" type="password" minlength="8" required></label><button class="btn primary">保存新密码</button></form>`)}
loginForm.onsubmit=async ev=>{ev.preventDefault();try{let r=await api("/login",{method:"POST",body:JSON.stringify({username:u.value,password:p.value})});token=r.token;localStorage.setItem(TOKEN,token);S.login=true;S.user=r.user;P="portal";if(r.user&&r.user.must_change_password){render();msg("请先修改默认密码");forcePasswordChange();return}await load();msg("登录成功")}catch(err){msg(err.message)}};
nav.onclick=ev=>{let b=ev.target.closest("button[data-p]");if(b)show(b.dataset.p)};modal.onclick=ev=>{if(ev.target.id=="modal")closeM()};document.addEventListener("click",ev=>{if(!ev.target.closest(".accountMenu"))closeAccount()});document.addEventListener("touchmove",ev=>{if(!S.login)ev.preventDefault()},{passive:false});render();load();
</script>
</body>
</html>
