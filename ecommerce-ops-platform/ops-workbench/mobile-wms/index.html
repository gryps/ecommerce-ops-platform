<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Gryps电商运营系统</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div class="app">
<section id="login" class="login">
  <div class="brand">
    <div class="logo">OPS</div>
    <div>
      <h1>Gryps电商运营系统</h1>
      <p class="sub">统一登录、按岗位进入业务模块</p>
    </div>
  </div>
  <form id="loginForm" class="card">
    <label>账号<input id="u" autocomplete="username" placeholder="请输入账号"></label>
    <label>密码<input id="p" type="password" autocomplete="current-password" placeholder="请输入密码"></label>
    <button class="btn primary">登录系统</button>
  </form>
</section>
<section id="main" class="main">
  <header class="top">
    <div>
      <h2 id="title">Gryps电商运营系统</h2>
      <p id="sub" class="sub">选择业务模块</p>
    </div>
    <div class="topActions">
      <button id="backBtn" class="btn ghost" onclick="backPortal()">入口</button>
      <button id="scanBtn" class="btn ghost" onclick="scan()">扫码</button>
      <div class="accountMenu">
        <button id="accountBtn" class="btn ghost" onclick="toggleAccount(event)">账号 ▾</button>
        <div id="accountPanel" class="accountPanel">
          <div id="accountMeta" class="meta"></div>
          <button class="btn ghost" onclick="userPanel();closeAccount()">用户管理</button>
          <button class="btn danger" onclick="logout()">退出登录</button>
        </div>
      </div>
    </div>
  </header>
  <main class="content">
    <section id="portal" class="page on"></section>
    <section id="home" class="page"></section>
    <section id="goods" class="page"></section>
    <section id="in" class="page"></section>
    <section id="out" class="page"></section>
    <section id="logPage" class="page"></section>
  </main>
  <nav id="nav" class="nav">
    <button data-p="home" class="on">⌂<span>工作台</span></button>
    <button data-p="goods">▦<span>商品</span></button>
    <button data-p="in">＋<span>入库</span></button>
    <button data-p="out">－<span>出库</span></button>
    <button data-p="logPage">≡<span>流水</span></button>
  </nav>
</section>
</div>
<div id="modal" class="modal">
  <div class="sheet">
    <div class="sheetHead">
      <h3 id="mt">操作</h3>
      <button class="btn ghost" onclick="closeM()">关闭</button>
    </div>
    <div id="mb" class="sheetBody"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<div id="orientationMask" class="orientationMask">
  <div class="card">
    <h3>Gryps电商运营系统</h3>
    <p class="sub">请竖屏使用</p>
  </div>
</div>
<script src="/assets/app.js" defer></script>
</body>
</html>
